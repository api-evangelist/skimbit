surface_only:
- surface: data-pipe
  datasets: [clicks, pages, commissions, products]
  reason: >-
    Event-level clicks, page impressions, commissions and product purchases are
    available ONLY through the batch Data Pipe export. Skimlinks states this
    explicitly. There is no REST operation and no candidate MCP tool that
    returns event-level rows, so an agent restricted to the API surface can see
    aggregates and raw commissions but never impressions or per-click detail.
