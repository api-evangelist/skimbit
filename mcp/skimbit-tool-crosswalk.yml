source: >-
  mcp/skimbit-mcp.yml, openapi/skimbit-*-openapi.yml,
  asyncapi/skimbit-data-pipe-asyncapi.yml
description: >-
  Binding between the candidate Skimlinks MCP tool surface and the REST
  operations that back it. IMPORTANT CAVEAT ON PROVENANCE: Skimlinks ships NO
  MCP server — neither hosted nor stdio — so the tool column is our own derived
  candidate set (mcp/skimbit-mcp.yml, deployment.mode: none), not a published
  manifest. Confidence is therefore high on the binding (each candidate tool was
  authored FROM an operationId, so the mapping is exact and each tool inherits
  that operation's real parameters as its inputSchema) but the surface itself is
  proposed, not shipped. There is no GraphQL surface.
surfaces:
  openapi:
    files:
    - openapi/skimbit-merchants-api-openapi.yml
    - openapi/skimbit-domains-api-openapi.yml
    - openapi/skimbit-verticals-api-openapi.yml
    - openapi/skimbit-offers-api-openapi.yml
    - openapi/skimbit-commissions-api-openapi.yml
    - openapi/skimbit-reports-api-openapi.yml
    - openapi/skimbit-payments-api-openapi.yml
    - openapi/skimbit-products-api-openapi.yml
    gated: false
    note: >-
      Specs are public (harvested from the provider's Apiary blueprints);
      calling them requires a publisher access_token, so every tool is
      account-gated at runtime.
  graphql:
    endpoint: null
    note: Skimlinks publishes no GraphQL surface.
  mcp:
    url: null
    gated: null
    note: >-
      No MCP server exists. Probed npm (registry search), the docs and the
      public MCP registries on 2026-08-13 with no first-party hit.
  data_pipe:
    spec: asyncapi/skimbit-data-pipe-asyncapi.yml
    gated: true
    note: >-
      Event-level data is delivered only as daily batch files to a
      contract-provisioned bucket. It is not reachable by an agent at call time
      and has no REST or MCP equivalent, which is why it appears in
      surface_only[] rather than in crosswalk[].
