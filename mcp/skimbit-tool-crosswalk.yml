rest_only:
- operation: getLinkReportDimensions
  reason: >-
    Enumerates the dimensions accepted by getLinkReport. Not wrapped as its own
    candidate tool; an agent should call it to discover valid dimension values
    before building a link-report query.
- operation: getLinkReportMetrics
  reason: Enumerates the metrics accepted by getLinkReport. Same discovery role.
- operation: getPageReportDimensions
