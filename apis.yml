aid: skimbit
name: SkimBit
description: >-
  SkimBit Ltd, operating as Skimlinks, is a London-founded content-monetization
  and affiliate-marketing platform (now part of Taboola) that helps publishers
  and content creators earn commerce revenue from the products and merchants
  they mention in editorial content. Skimlinks automatically affiliates outbound
  merchant links, tracks the resulting clicks and commissions across thousands
  of affiliate networks and merchant programs, and pays publishers a share of
  the revenue. For developers, Skimlinks exposes a suite of publisher-facing
  REST APIs — the Merchant API (merchant programs, domains, verticals and
  offers), the Reporting API (raw commissions, aggregated performance,
  trending/purchased products, payment status and deactivated merchants) and the
  Product Key API (product details, pricing, availability and merchant
  alternatives across a billion+ product offers) — plus the Skimlinks
  JavaScript on-page monetization script and a batch Data Pipe delivering
  event-level clicks, impressions, commissions and product-purchase data to
  cloud storage.
