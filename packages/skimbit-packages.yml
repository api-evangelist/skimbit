gaps:
- >-
  No first-party client library exists in any language for the Merchant,
  Reporting or Product Key APIs. Every integrator writes the timestamp-based
  access_token exchange and the offset pagination loop from scratch.
- >-
  The on-page Skimlinks JavaScript is distributed unpinned. There is no
  integrity hash, no versioned URL and no changelog, so publishers cannot pin,
  diff or roll back the script running on their pages.
